<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register | Gamer Zone</title>
  {% load static %}
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Orbitron', sans-serif;
      background: url("{% static 'img/forgetpass-bg-5.jpg' %}") no-repeat center center fixed;
      background-size: cover;
      color: #fff;
    }

    .overlay {
      background: rgba(0, 0, 0, 0.75);
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    .form-container {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 60px auto;
      background: rgba(20, 20, 20, 0.85);
      padding: 40px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 0 30px rgba(255, 0, 100, 0.2);
    }

    .logo {
      width: 180px;
      margin-bottom: 20px;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 24px;
      color: #ff365e;
    }

    form {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group input {
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #2c2c2c;
      color: #eee;
      font-size: 14px;
      transition: 0.3s;
    }

    .form-group input:focus {
      outline: none;
      background: #3b3b3b;
    }

    .errorlist {
      margin: 0 0 5px 0;
      padding: 0;
      color: #ff5f7e;
      font-size: 12px;
      list-style: none;
    }

    .form-footer {
      grid-column: 1 / -1;
      margin-top: 30px;
      text-align: center;
    }

    .form-footer input[type="submit"] {
      padding: 14px 30px;
      background: #ff365e;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .form-footer input[type="submit"]:hover {
      background: #ff5e80;
    }

    .links {
      margin-top: 20px;
      font-size: 12px;
    }

    .links a {
      color: #00ffc8;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

    @media (max-width: 700px) {
      form {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <div class="form-container">
    <img class="logo" src="{% static 'img/logo.png' %}" alt="Logo">

    <h1>Create Your Gamer Account</h1>

    <form method="post" novalidate>
      {% csrf_token %}

      {% for field in form %}
        <div class="form-group">
          {{ field.errors }}
          {{ field }}
        </div>
      {% endfor %}

      <div class="form-footer">
        <input type="submit" value="Submit Signup">
        <div class="links">
          <p>Do you accept the <a href="#">privacy and policy rules</a>?</p>
          <p><a href="https://support.google.com/accounts/answer/27441?hl=en">Create Email Account</a></p>
          <p>Do you have an account? <a href="{% url 'accounts:login' %}">Login</a></p>
        </div>
      </div>
    </form>
  </div>
</body>
</html>
