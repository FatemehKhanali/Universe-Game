<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Logged Out - Game Universe</title>
    {% load static %}
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #121212);
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-image: url("{% static 'img/logout-bg.jpg' %}");
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 0;
        }

        .logout-box {
            z-index: 1;
            background: rgba(255, 255, 255, 0.05);
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(255, 99, 132, 0.3);
            backdrop-filter: blur(12px);
        }

        h1 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            margin-bottom: 40px;
            color: #ccc;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border: none;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s ease;
        }

        .btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="logout-box">
        <h1>You have been logged out</h1>
        <p>Thanks for visiting Game Universe. See you next time!</p>
        <a href="{% url 'accounts:login' %}" class="btn">Login Again</a>
        <br><br>
        <a href="/" class="btn" style="background: #444;">Return Home</a>
    </div>
</body>
</html>
