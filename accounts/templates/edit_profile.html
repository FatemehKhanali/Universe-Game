<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Edit Profile</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            height: 100vh;
            overflow: hidden;
            color: #fff;
        }

        .stars, .stars2, .stars3 {
            position: absolute;
            width: 100%;
            height: 100%;
            background: transparent url('https://raw.githubusercontent.com/JulianLaval/canvas-space/master/stars.png') repeat top center;
            animation: moveStars 100s linear infinite;
            z-index: 0;
        }

        .stars2 {
            background: transparent url('https://raw.githubusercontent.com/JulianLaval/canvas-space/master/stars2.png') repeat top center;
            animation: moveStars 200s linear infinite;
        }

        .stars3 {
            background: transparent url('https://raw.githubusercontent.com/JulianLaval/canvas-space/master/stars3.png') repeat top center;
            animation: moveStars 300s linear infinite;
        }

        @keyframes moveStars {
            from {background-position: 0 0;}
            to {background-position: -10000px 5000px;}
        }

        .container {
            position: relative;
            max-width: 600px;
            margin: 100px auto;
            background: rgba(0, 0, 0, 0.6);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        h2 {
            text-align: center;
            color: #00e0ff;
            margin-bottom: 25px;
        }

        .message {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }

        .message.success {
            background: #198754;
            color: white;
        }

        .message.error {
            background: #dc3545;
            color: white;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
        }

        select, input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: none;
            margin-bottom: 20px;
            font-size: 15px;
            background-color: #2c3e50;
            color: #fff;
        }

        button {
            background-color: #00e0ff;
            color: #000;
            border: none;
            padding: 12px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #00bcd4;
        }

        a button {
            margin-top: 10px;
            background-color: #6c757d;
        }

        a button:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

<div class="stars"></div>
<div class="stars2"></div>
<div class="stars3"></div>

<div class="container">
    <h2>Edit Profile</h2>

    <div id="message-box"></div>

    <form method="post" id="profile-form">
        {% csrf_token %}

        <label>Province</label>
        {{ form.province }}

        <label>City</label>
        {{ form.city }}

        <label>Postal Code</label>
        {{ form.postal_code }}

        <label>Address</label>
        {{ form.address }}

        <button type="submit">Save</button>
        <a href="{% url 'index' %}"><button type="button">Home Page</button></a>
    </form>
</div>

<script>
    document.getElementById('id_province').addEventListener('change', function () {
        const provinceId = this.value;
        const url = `{% url 'accounts:get_cities' %}?province_id=${provinceId}`;

        fetch(url)
            .then(response => response.json())
            .then(data => {
                const citySelect = document.getElementById('id_city');
                citySelect.innerHTML = '<option value="">---------</option>';
                data.forEach(city => {
                    const option = document.createElement('option');
                    option.value = city.id;
                    option.text = city.title;
                    citySelect.appendChild(option);
                });
            })
            .catch(error => console.error('Error loading cities:', error));
    });

    document.getElementById('profile-form').addEventListener('submit', function(e) {
        e.preventDefault();  // جلوگیری از رفرش

        const form = this;
        const url = form.action || window.location.href;
        const formData = new FormData(form);

        fetch(url, {
            method: 'POST',
            headers: { 'X-Requested-With': 'XMLHttpRequest' },
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            const msgBox = document.getElementById('message-box');
            msgBox.innerHTML = '';

            const div = document.createElement('div');
            div.classList.add('message');

            if (data.success) {
                div.classList.add('success');
                div.textContent = 'Information saved successfully!';
            } else {
                div.classList.add('error');
                div.textContent = 'Error: ' + (data.error || 'Something went wrong.');
            }

            msgBox.appendChild(div);
        })
        .catch(error => {
            console.error('Error:', error);
            alert('An unexpected error occurred.');
        });
    });
</script>

</body>
</html>
